<mat-toolbar color="primary">

  <span style="margin-right: 20px;">Dental App</span>

  <span class="spacer"></span>

  <button mat-button *ngFor="let item of headers" [routerLink]="getRoute(item.ruta)">

    <mat-icon>{{ item.icono }}</mat-icon>
    {{ item.nombre }}

  </button>

  <button 
    *ngIf="isLoggedIn"
    mat-button
    (click)="logout()">

    <mat-icon>logout</mat-icon>
    Logout
  </button>

</mat-toolbar>
