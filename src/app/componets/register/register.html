<div class="register-container">
  <h2>Registro de Usuario</h2>

  <form (ngSubmit)="register()" #registerForm="ngForm">

    <div class="form-group">
      <label>Nombre</label>
      <input
        type="text"
        name="nombre"
        [(ngModel)]="nombre"
        required
      />
    </div>

    <div class="form-group">
      <label>Apellido</label>
      <input
        type="text"
        name="apellido"
        [(ngModel)]="apellido"
        required
      />
    </div>

    <div class="form-group">
      <label>Usuario</label>
      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        required
      />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
      />
    </div>

    <div class="form-group">
      <label>Confirmar Contraseña</label>
      <input
        type="password"
        name="confirmPassword"
        [(ngModel)]="confirmPassword"
        required
      />
    </div>

    <button type="submit">Registrar</button>

  </form>
</div>
