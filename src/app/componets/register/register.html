<mat-card class="register-card">
  <h2>Registro de Usuario</h2>

  <form (ngSubmit)="register()" #registerForm="ngForm">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput name="nombre" [(ngModel)]="nombre" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Apellido</mat-label>
      <input matInput name="apellido" [(ngModel)]="apellido" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Usuario</mat-label>
      <input matInput name="username" [(ngModel)]="username" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" name="password" [(ngModel)]="password" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirmar Contraseña</mat-label>
      <input matInput type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required>
    </mat-form-field>

    <button 
      mat-raised-button 
      color="primary" 
      type="submit"
      class="full-width"
    >
      Registrarse
    </button>

  </form>
</mat-card>
